name: Conformance

# The Organisation's conformance check, served from here so that agreeing a convention once makes
# it true everywhere: a repository calls this workflow, and a rule added here reaches every caller
# as a pin bump rather than as N edits nobody remembers to make (#73).
on:
  workflow_call:

# `issues` and `pull-requests` are here for the linkage step at the foot of this job, which reads
# the pull request against the issue it closes (#76, ADR-0035). A called workflow may only narrow
# what its caller granted, so a repository whose own workflow grants less than this cannot call
# this one at all — which is why the rollout (#78) carries the caller-side grant with it.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # The caller reports this as `<its job id> / check`, which is the context its ruleset must
  # require. Renaming this job renames that context in every repository at once.
  check:
    runs-on: ubuntu-latest
    steps:
      # The caller's tree, into a subdirectory rather than the workspace root: the checker walks
      # the top-level directories of what it is given, and a second checkout beside them would be
      # a directory the repository never wrote and could not have a `MAP.md` row for.
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs here.
      #
      # `fetch-depth: 0` because the trailer step below reads the pull request's own commits, and
      # the whole range between base and head has to be reachable rather than just the head
      # commit (ADR-0018).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          fetch-depth: 0

      # The checker itself, at the commit this workflow was called at rather than at whatever
      # `main` holds by the time the job starts. The caller pins the workflow; without this the
      # rules it runs would still float, and the pin would guarantee nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jerome-Group/.github
          ref: ${{ github.job_workflow_sha }}
          path: dot-github

      # Through `sh` because the Contents API cannot commit an executable blob — see the header of
      # the script itself.
      #
      # The caller's repository is passed because one of them — the hub the mirrored documents are
      # authored in — holds those files rather than copying them, and holding a source to a hash
      # pinned beside the checker would stop it ever editing its own documents (ADR-0034). GitHub
      # sets `github.repository`; a repository cannot claim to be another one.
      - run: sh dot-github/conformance/check-conformance.sh tree "${{ github.repository }}"

      # The attribution trailers, for every repository rather than only the one that built the
      # check (#75, ADR-0032). The rule is inherited by every repository through `CONTRIBUTING.md`
      # and its `AGENTS.md`; until this step existed, its enforcement was not.
      #
      # A step of this job rather than a job of its own: the caller's ruleset requires
      # `<job id> / check`, so a second job here would be a second context every repository in the
      # Organisation has to add to its ruleset before its merges stop hanging on a check that is
      # required and never reported.
      #
      # Guarded on the event because the range is the pull request's own commits — base to head,
      # by SHA rather than `HEAD`, which on a `pull_request` event is a synthetic merge commit
      # whose trailers are GitHub's. A caller that runs this workflow on a push has no such range,
      # and inventing one would check commits that are already on the default branch, where a
      # squash has moved the contributor's trailers out of the final block (ADR-0018).
      - if: github.event_name == 'pull_request'
        working-directory: tree
        run: sh ../dot-github/conformance/check-trailers.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # The secret scanner, pinned and checksum-verified rather than fetched fresh, because a
      # tool this workflow hands a repository's whole history to is one more thing that has to be
      # the thing we pinned (#77, ADR-0036).
      #
      # Its own step rather than a line inside the scan below, so the two failures cannot be
      # confused: red here is the toolchain, red there is a credential. `runner.temp` because the
      # binary belongs to the run and not to either checked-out tree — `tree/` is held to
      # containing only what the caller committed.
      - if: github.event_name == 'pull_request'
        run: sh dot-github/conformance/install-gitleaks.sh "$RUNNER_TEMP/scanners"

      # Every repository including the private ones, which is the whole point: public
      # repositories already have GitHub's secret scanning and push protection free through the
      # Public baseline, private ones have neither and are not being licensed, and so this is
      # their only control (ADR-0036).
      #
      # Guarded on the event and ranged base-to-head for the reasons the trailer step above gives.
      # It matters more here: the range is what makes the scan read the commits the pull request
      # added rather than the tree they produced, so a credential added and later deleted on the
      # same branch is still found — it is on GitHub's servers either way.
      #
      # A step of this job, again, so the Organisation gains a rule rather than a second required
      # context every repository's ruleset has to grow before its merges stop hanging.
      - if: github.event_name == 'pull_request'
        working-directory: tree
        env:
          GITLEAKS: ${{ runner.temp }}/scanners/gitleaks
        run: sh ../dot-github/conformance/check-secrets.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # The pull request read against the issue it came from: the acceptance boxes ticked or
      # explained, the drift block present, the issue triaged onto both label axes (#76).
      #
      # Two commands rather than one because they are two scripts, and they are two scripts
      # because only the second can be exercised offline — the fixtures in the hub drive every
      # rule, and nothing drives a `gh api` call (ADR-0035). The case directory is written beside
      # the two checkouts rather than inside `tree/`, which is a tree the caller's repository is
      # held to and must contain only what it committed.
      #
      # A step of this job, and guarded on the event, for the two reasons the trailer step above
      # is: a second job would be a second required context in every repository's ruleset, and a
      # caller running this workflow on a push has no pull request to read.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh dot-github/conformance/resolve-issue-linkage.sh \
            "${{ github.repository }}" "${{ github.event.pull_request.number }}" linkage
          sh dot-github/conformance/check-issue-linkage.sh linkage
