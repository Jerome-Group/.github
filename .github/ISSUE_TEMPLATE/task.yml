name: Task
description: Something should work differently.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A task proposes a change you already want. If you are reporting that something is
        *broken*, the Bug form is the better fit.

        If this repository has a `CONTEXT.md`, it is the glossary — using its words here saves a
        round-trip.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences — what should change.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: What happens today, and where you saw it.
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: Desired behaviour
      description: What should happen instead. Concrete enough that someone else could tell whether it is done.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Alternatives you considered, prior attempts, links — whatever helps.
