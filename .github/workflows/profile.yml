name: Refresh organisation profile

on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organisation-profile-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Jerome-Group/.github' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Collect and render public organisation activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B profile/scripts/dashboard.py "$RUNNER_TEMP/profile-data"
      - name: Publish complete snapshot
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/profile-data; then
            git checkout -B profile-data origin/profile-data
          else
            git checkout --orphan profile-data
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/profile-data/"* .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add counters.svg calendar.svg activity.svg assistance.svg README.md snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public organisation activity' -m 'Assisted-by: none'
            git push origin HEAD:profile-data
          fi
